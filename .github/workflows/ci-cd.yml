name: CI/CD

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      - if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dist
          path: dist

      - uses: aws-actions/configure-aws-credentials@45666896f5d8e0f10ae255413f3a4cdd03bdc8f5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload hashed assets
        run: >
          aws s3 cp dist/assets "s3://$S3_BUCKET/assets" --recursive --no-progress
          --cache-control "public, max-age=31536000, immutable"

      - name: Upload unhashed files
        run: >
          aws s3 cp dist "s3://$S3_BUCKET" --recursive --no-progress
          --exclude "assets/*" --exclude "index.html"
          --cache-control "public, max-age=86400"

      - name: Upload index.html
        run: >
          aws s3 cp dist/index.html "s3://$S3_BUCKET/index.html" --no-progress
          --cache-control "no-cache"

      - name: Remove files from previous builds
        run: aws s3 sync dist "s3://$S3_BUCKET" --delete --size-only --no-progress

      - name: Invalidate CloudFront cache
        run: >
          aws cloudfront create-invalidation
          --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"
